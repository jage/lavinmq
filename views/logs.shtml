<!--#set var="TITLE" value="Logs" -->
<!DOCTYPE html>
<html lang="en" class="logs">
  <head>
    <!--#include file="partials/head.shtml" -->
    <script type="module" src="js/logs.js"></script>
  </head>
  <body>
    <!--#include file="partials/header.shtml" -->
    <main class="main-grid">
      <div id="breadcrumbs" class="cols-12">
          <h2 class="page-title"><span><!--#echo var="TITLE" --></span></h2>
      </div>
      <section class="card">
       <div class="log-toolbar-container">
        <div class="seg-control" role="group" aria-label="Scroll position">
          <button id="to-bottom">Newest</button>
          <button id="to-top">Oldest</button>
        </div>
        <div class="seg-control">
          <button id="toggle-wrap">Wrap lines</button>
        </div>
        <a id="download-logs" class="btn btn-green" download href="api/logs">Download logs</a>
        </div>
        <div id="livelog" class="livelog">
          <div id="table-error"></div>
          <div id="livelog-lines"></div>
        </div>
      </section>
    </main>
    <!--#include file="partials/footer.shtml" -->
  </body>
</html>
