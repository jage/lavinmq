  if ($('cmp-few')) $('cmp-few').addEventListener('click', function () { cmpFew[key] = true; compare(); });
  if ($('cmp-more')) $('cmp-more').addEventListener('click', function () { cmpAll = !cmpAll; compare(); });
  $('cmp-table').querySelectorAll('tr[data-i]').forEach(function (tr) {
    tr.addEventListener('click', function () {
      var o = rows[+tr.dataset.i], x = $('cmp-table').querySelector('tr[data-x="' + tr.dataset.i + '"]');
      if (!x.hidden) { x.hidden = true; return; }
      var A1 = neighbours(A, o.n), B1 = neighbours(B, o.n);
      var part = function (title, ka) { var keys = {}; Object.keys(A1[ka]).forEach(function (k) { keys[k] = 1; }); Object.keys(B1[ka]).forEach(function (k) { keys[k] = 1; });
        var list = Object.keys(keys).map(function (k) { return { k: k, a: (A1[ka][k] || 0) / na, b: (B1[ka][k] || 0) / nb }; }).sort(function (p, q) { return Math.max(q.a, q.b) - Math.max(p.a, p.b); }).slice(0, 8);
        return '<div><div class="hint" style="margin-bottom:4px">' + title + '</div><table><tbody>' + list.map(function (l) { var d = l.b - l.a; return '<tr><td class="name" title="' + h(l.k) + '">' + h(short(l.k)) + '</td><td class="num">' + val(l.a) + '</td><td class="num">' + val(l.b) + '</td><td class="num" style="color:' + (d > 0 ? up : down) + '">' + chg(d) + '</td></tr>'; }).join('') + '</tbody></table></div>'; };
      x.firstChild.innerHTML = '<div class="hint mono" style="padding-top:4px;font-family:var(--mono);overflow-wrap:anywhere">' + h(o.n) + '</div><div class="split" style="padding:6px 0 10px">' + part('Called from (before, after, change)', 'up') + part('Calls (before, after, change)', 'down') + '</div>';
      x.hidden = false;
    });
  });
  // summary cards
  var cards = [['Before', A.name, pa.n + ' samples' + (A.timed ? ' in ' + ms(A.dur) : '')], ['After', B.name, pb.n + ' samples' + (B.timed ? ' in ' + ms(B.dur) : '')]];
  if (A.timed && B.timed) {
    var cps = function (r) { return r.total / (r.dur / 1e6) / (r.hz || 99); };
    cards.push(['CPU busy', cps(A).toFixed(2) + ' → ' + cps(B).toFixed(2), 'cores on average']);
    var stw = function (r) { return r.gcs.length ? Math.max.apply(null, r.gcs.map(function (g) { return g.stw; })) : 0; };
    cards.push(['Longest GC pause', ms(stw(A)) + ' → ' + ms(stw(B)), 'stop-the-world', stw(B) > stw(A) * 1.5]);
  }
  if (A.hasMem && B.hasMem) {
    var rate = function (r) { var a = r.mem[0], b = r.mem[r.mem.length - 1]; return r.allocTotal / Math.max(1e-6, (b.t - a.t) / 1e6); };
    cards.push(['Allocated', bytes(rate(A)) + '/s → ' + bytes(rate(B)) + '/s', 'by libgc\'s count', rate(B) > rate(A) * 1.5],
      ['Peak resident', bytes(A.peak * 1024) + ' → ' + bytes(B.peak * 1024), 'resident set', B.peak > A.peak * 1.5]);
  }
  $('cmp-stats').innerHTML = cards.map(function (c) { return '<div class="stat' + (c[3] ? ' hot' : '') + '"><div class="k">' + h(c[0]) + '</div><div class="v" style="font-size:15px;overflow-wrap:anywhere">' + h(c[1]) + '</div><div class="s">' + h(c[2]) + '</div></div>'; }).join('');
  // fibers and collections, per second
  var both = A.timed && B.timed;
  $('cmp-fibers-panel').hidden = $('cmp-gc-panel').hidden = !both;
  $('cmp-obj-panel').hidden = !(A.objects.length || B.objects.length);
  if (A.objects.length || B.objects.length) {
    var on = {}; A.objects.concat(B.objects).forEach(function (o) { on[o.n] = 1; });
    var get = function (r, n) { return r.objects.filter(function (o) { return o.n === n; })[0] || { created: 0, finalized: 0, live: 0 }; };
    var orows = Object.keys(on).map(function (n) { return { n: n, a: get(A, n), b: get(B, n) }; }).sort(function (x, y) { return Math.max(Math.abs(y.a.live), Math.abs(y.b.live)) - Math.max(Math.abs(x.a.live), Math.abs(x.b.live)); });
    var sg = function (v) { return '<span style="color:' + (v > 0 ? 'var(--worse)' : 'inherit') + '">' + (v > 0 ? '+' : '') + v.toLocaleString() + '</span>'; };
    $('cmp-obj').innerHTML = '<thead><tr><th>Created by</th><th class="num">Created before</th><th class="num">after</th><th class="num">Change alive before</th><th class="num">after</th></tr></thead><tbody>' + orows.map(function (o) { return '<tr><td class="name" title="' + h(o.n) + '">' + h(short(o.n)) + '</td><td class="num">' + o.a.created.toLocaleString() + '</td><td class="num">' + o.b.created.toLocaleString() + '</td><td class="num">' + sg(o.a.live) + '</td><td class="num">' + sg(o.b.live) + '</td></tr>'; }).join('') + '</tbody>';
  }
  if (both) {
    var fn = {}; Object.keys(A.fs).forEach(function (n) { fn[n] = 1; }); Object.keys(B.fs).forEach(function (n) { fn[n] = 1; });
    var per = function (r, n, k) { var f = r.fs[n]; return f ? f[k] / (r.dur / 1e6) : 0; };
    var fr = Object.keys(fn).map(function (n) { return { n: n, a: per(A, n, 'busy') / 1000, b: per(B, n, 'busy') / 1000, ma: (A.fs[n] || {}).max || 0, mb: (B.fs[n] || {}).max || 0, fa: A.fs[n] || {}, fb: B.fs[n] || {} }; }).sort(function (x, y) { return score(y) - score(x); }).slice(0, 15);
    // fibers spawned 5 or more times more than they finished first: they pile up
    function net(f) { return (f.spawned || 0) - (f.finished || 0); }
    function score(o) { var n = Math.max(net(o.fa), net(o.fb)); return n >= 5 ? 1e9 + n : Math.max(o.a, o.b); }
    var sf = function (f) { return f.spawned || f.finished ? '<span style="color:' + (net(f) >= 5 ? 'var(--worse)' : 'inherit') + '">' + (f.spawned || 0) + ' / ' + (f.finished || 0) + '</span>' : ''; };
    $('cmp-fibers').innerHTML = '<thead><tr><th>Fiber</th><th class="num">Busy ms/s before</th><th class="num">after</th><th class="num">Longest run before</th><th class="num">after</th><th class="num" title="fibers of this name spawned / finished during the recording">Spawned / finished before</th><th class="num">after</th></tr></thead><tbody>' + fr.map(function (o) { return '<tr><td class="name"><span class="sw" style="background:' + fiberColor(o.n) + '"></span>' + h(o.n) + '</td><td class="num">' + o.a.toFixed(1) + '</td><td class="num">' + o.b.toFixed(1) + '</td><td class="num">' + (o.ma ? ms(o.ma) : '–') + '</td><td class="num">' + (o.mb ? ms(o.mb) : '–') + '</td><td class="num">' + sf(o.fa) + '</td><td class="num">' + sf(o.fb) + '</td></tr>'; }).join('') + '</tbody>';
    var g = function (r) { var s = r.gcs.map(function (x) { return x.stw; }); return { n: r.gcs.length / (r.dur / 1e6), avg: s.length ? s.reduce(function (a, b) { return a + b; }, 0) / s.length : 0, max: s.length ? Math.max.apply(null, s) : 0, heap: r.gcs.length ? Math.max.apply(null, r.gcs.map(function (x) { return x.heap; })) : 0 }; };
    var ga = g(A), gb = g(B);
    $('cmp-gc').innerHTML = '<thead><tr><th></th><th class="num">Before</th><th class="num">After</th></tr></thead><tbody>' +
      [['GC collections per second', ga.n.toFixed(2), gb.n.toFixed(2)], ['Stop-the-world, average', ms(ga.avg), ms(gb.avg)], ['Stop-the-world, longest', ms(ga.max), ms(gb.max)], ['Largest heap', (ga.heap / 1024).toFixed(0) + ' MB', (gb.heap / 1024).toFixed(0) + ' MB']].map(function (r) { return '<tr><td>' + r[0] + '</td><td class="num">' + r[1] + '</td><td class="num">' + r[2] + '</td></tr>'; }).join('') + '</tbody>';
  }
}
$('cmp-measure').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; cmpMeas = b.dataset.m; $('cmp-measure').querySelectorAll('button').forEach(function (o) { o.setAttribute('aria-pressed', o === b ? 'true' : 'false'); }); compare(); });
$('cmp-mode').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; cmpMode = b.dataset.mode; $('cmp-mode').querySelectorAll('button').forEach(function (o) { o.setAttribute('aria-pressed', o === b ? 'true' : 'false'); }); compare(); });
['cmp-a', 'cmp-b'].forEach(function (id) { $(id).addEventListener('change', compare); });
$('cmp-q').addEventListener('input', compare);

// ---------- help, on demand ----------
var HELP = {
  timeline: function (r) { var per = ms(1e6 / (r.hz || 99)); return '<h3>What you see</h3><ul>' +
    '<li><b>One row per thread.</b> A colored block is one fiber running, colored by fiber as in the legend. Gray: runs too short to draw (under ' + (r.run_min_us || 200) + ' µs), summed. Pale: idle.</li>' +
    '<li><b>Ticks</b> under a row are CPU samples, one per ' + per + ' on CPU. Point at one for its stack.</li>' +
    '<li><b>GC</b>: orange while a collection runs, red while it stops every thread, which also shows as a red band across all rows.</li>' +
    (r.hasMem ? '<li><b>Memory</b>: resident memory as the kernel counts it, anonymous (the GC heap, malloc) below file backed (mapped segment files). The dashed line is the GC heap.</li><li><b>Allocated</b>: what libgc allocated, per 100 ms.</li>' : '') +
    '<li>A long block with few ticks was mostly off CPU: blocked, or waiting.</li></ul>' +
    '<h3>What you can do</h3><ul><li>Drag across rows to select a time range; click a block to select that run, or a tick to select that sample.</li>' +
    '<li>Click a thread name to show only that thread.</li>' +
    '<li><kbd>Ctrl</kbd> + wheel zooms, <kbd>Shift</kbd> + wheel pans. Drag the strip on top to move; double-click it to see everything.</li>' +
    '<li>The flame graph and tables below cover what is selected.</li></ul>'; },
  flame: function (r) { return '<h3>What you see</h3><ul>' +
    '<li>Each bar is a function, as wide as its share of what is selected; below it, what it called. The top bars are where threads or fibers start.</li>' +
    '<li><b>CPU</b>: samples, one per ' + ms(1e6 / (r.hz || 99)) + ' per thread on CPU. A run shorter than that may have none.</li>' +
    '<li><b>Allocated</b>: a stack every ' + (r.alloc_sample_kb || 256) + ' KB a thread allocates, weighted by the bytes. Estimates: small amounts are noise; the exact rate is on the timeline.</li>' +
    '<li><b>Mapped</b>: mmap calls, by size.</li>' +
    '<li>Kernel frames fold into one, named by the syscall; Full stacks shows them all.</li></ul>' +
    '<h3>What you can do</h3><ul><li>Click a bar to zoom in and see its source lines (for a call, the line of the call); click the top row to zoom out.</li>' +
    '<li>Filter by function name, or with a preset: matching bars turn pink, and with “only matching stacks” the rest is left out.</li>' +
    '<li>Pick a thread or a fiber to see only its stacks.</li></ul>'; },
  fibers: function () { return '<ul>' +
    '<li><b>Busy</b>: from switch in to switch out, less time idle in epoll or parked. A fiber blocked in another syscall counts as busy.</li>' +
    '<li><b>Spawned / finished</b>: fibers of that name; many more spawned than finished pile up.</li>' +
    '<li>The first columns cover the whole recording, the last two the selection.</li>' +
    '<li>Click a row to see that fiber in the flame graph and on the timeline.</li></ul>'; },
  gc: function () { return '<ul>' +
    '<li><b>GC collection</b>: how long the collection held the allocator lock; threads that allocate wait for it.</li>' +
    '<li><b>Stop-the-world</b>: how long every thread was stopped.</li>' +
    '<li><b>Allocated before it</b>: what libgc allocated since the collection before.</li>' +
    '<li>Click a row to select that collection on the timeline.</li></ul>'; },
  objects: function () { return '<ul>' +
    '<li>Objects Crystal registers a finalizer for (sockets, files, digests), by the method that created them, over the whole recording.</li>' +
    '<li>They are finalized when a collection finds them unreachable, so <b>change alive</b> should fall back once the load stops. One that stays up is objects something still holds.</li>' +
    '<li>Objects created before the recording count against it when finalized.</li></ul>'; },
  compare: function () { return '<h3>What you see</h3><ul>' +
    '<li>Functions ranked by how much they changed between the two recordings. Red: more after, blue: less.</li>' +
    '<li><b>CPU</b> compares each function’s share of its recording’s samples, so changes are relative. <b>Allocated</b> compares bytes per second, since a fix that allocates less shrinks the total.</li>' +
    '<li><b>On the stack</b> counts a function with what it calls; <b>Running itself</b> only the function.</li>' +
    '<li>New or gone: only one side has it.</li></ul>' +
    '<h3>What you can do</h3><ul><li>Click a row for its callers and callees, before and after.</li><li>Filter by function name.</li></ul>'; }
};
var helpEl = null, helpBtn = null;
function closeHelp() { if (helpEl) { helpEl.remove(); helpEl = null; } if (helpBtn) { helpBtn.setAttribute('aria-expanded', 'false'); helpBtn = null; } }
document.addEventListener('click', function (e) {
  var b = e.target.closest('button.info');
  if (!b) { if (helpEl && !helpEl.contains(e.target)) closeHelp(); return; }
  if (helpBtn === b) { closeHelp(); return; }
  closeHelp();
  var key = b.dataset.help;
  if (key === 'tab') key = $('sub-tabs').querySelector('[role=tab][aria-selected=true]').dataset.tab;
  var card = b.closest('.card'), br = b.getBoundingClientRect(), cr = card.getBoundingClientRect();
  helpEl = document.createElement('div'); helpEl.className = 'help'; helpEl.setAttribute('role', 'dialog'); helpEl.setAttribute('aria-label', b.getAttribute('aria-label'));
  helpEl.innerHTML = '<button type="button" class="close" aria-label="Close">×</button>' + HELP[key](cur);
  helpEl.style.top = (br.bottom - cr.top + card.scrollTop + 6) + 'px';
  card.appendChild(helpEl); helpBtn = b; b.setAttribute('aria-expanded', 'true');
  // under the button, ending at its right edge, inside the card
  helpEl.style.left = Math.max(8, Math.min(cr.width - helpEl.offsetWidth - 8, br.right - cr.left - helpEl.offsetWidth)) + 'px';
  helpEl.querySelector('.close').addEventListener('click', closeHelp);
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeHelp(); });
$('sub-tabs').addEventListener('click', function (e) { if (e.target.closest('[role=tab]')) closeHelp(); });

// ---------- views ----------
function showRec(i) {
  resetGrow(); cur = RECS[i]; sel = null; thr = null; fib = null; view = { t0: 0, t1: cur.dur };
  $('rec-pick').value = i;
  header(); flame.setGroup(cur.timed ? 'thread' : 'none'); drawTimeline(); buttons(); flame.load(); fibersTab(); gcTab(); objectsTab();
  var b = $('sub-tabs').querySelector('[role=tab][aria-selected=true]'); if (b.hidden) b = $('sub-tabs').querySelector('[data-tab=flame]'); b.click();
}
function setView(v) {
  $('views').querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-selected', b.dataset.view === v ? 'true' : 'false'); });
  $('view-rec').hidden = v !== 'rec'; $('view-cmp').hidden = v !== 'cmp'; $('rec-pick-wrap').hidden = v !== 'rec' || RECS.length < 2;
  if (v === 'cmp') compare(); else { drawTimeline(); flame.draw(); }
  try { history.replaceState(null, '', '#' + (v === 'cmp' ? 'compare' : 'recording')); } catch (e) {}
}
$('views').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b && !b.disabled) setView(b.dataset.view); });
RECS.forEach(function (r, i) { ['rec-pick', 'cmp-a', 'cmp-b'].forEach(function (id) { var o = document.createElement('option'); o.value = i; o.textContent = r.name; $(id).appendChild(o); }); });
$('rec-pick').addEventListener('change', function () { showRec(+$('rec-pick').value); });
// A page that embeds the report can set window.REPORT_INIT before this
// script: { rec, view: 'rec' | 'cmp', a, b, mode: 'stack' | 'self',
// select: { t0, t1 } in µs or { gc: n }, thread: name, fiber: name, tab,
// filter }.
var INIT = window.REPORT_INIT || {};
$('cmp-b').value = Math.min(1, RECS.length - 1);
if (INIT.a != null) $('cmp-a').value = INIT.a;
if (INIT.b != null) $('cmp-b').value = INIT.b;
if (INIT.cmpMeasure) { cmpMeas = INIT.cmpMeasure; $('cmp-measure').querySelectorAll('button').forEach(function (o) { o.setAttribute('aria-pressed', o.dataset.m === cmpMeas ? 'true' : 'false'); }); }
if (INIT.mode) { cmpMode = INIT.mode; $('cmp-mode').querySelectorAll('button').forEach(function (o) { o.setAttribute('aria-pressed', o.dataset.mode === cmpMode ? 'true' : 'false'); }); }
$('views').hidden = RECS.length < 2;
document.title = 'lavinmq-bpf report: ' + RECS.map(function (r) { return r.name; }).join(', ');
// theme: the toggle overrides the system setting, remembered in this browser
function isDark() { var t = document.documentElement.dataset.theme; return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; }
try { var saved = localStorage.getItem('lavinmq-bpf-theme'); if (saved) document.documentElement.dataset.theme = saved; } catch (e) {}
$('theme').addEventListener('click', function () {
  var t = isDark() ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('lavinmq-bpf-theme', t); } catch (e) {}
  drawTimeline(); flame.draw(); header(); if (!$('view-cmp').hidden) compare();
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { drawTimeline(); flame.draw(); header(); });
showRec(INIT.rec || 0);
if (INIT.select && cur.timed) {
  var g0 = INIT.select.gc != null ? cur.gcs[INIT.select.gc] : null;
  sel = g0 ? { t0: g0.s, t1: g0.s + g0.span } : { t0: INIT.select.t0, t1: INIT.select.t1 };
  if (g0) { var pad = Math.max(g0.span * 4, 20000); view.t0 = Math.max(0, g0.s - pad); view.t1 = Math.min(cur.dur, g0.s + g0.span + pad); }
}
if (INIT.thread) cur.threads.forEach(function (t) { if (t.name === INIT.thread) thr = t.ti; });
if (INIT.fiber) fib = INIT.fiber;
if (INIT.select || INIT.thread || INIT.fiber) selectionChanged();
if (INIT.measure) flame.setMeasure(INIT.measure);
if (INIT.filter) { $('fg-q').value = INIT.filter; $('fg-q').dispatchEvent(new Event('change')); }
if (INIT.tab) { var tb = $('sub-tabs').querySelector('[data-tab=' + INIT.tab + ']'); if (tb && !tb.hidden) tb.click(); }
setView(INIT.view || (RECS.length >= 2 && location.hash === '#compare' ? 'cmp' : 'rec'));
})();
</script>
