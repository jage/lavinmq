<title>Acton bdwgc for LavinMQ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one reading column (max 72rem) on the LavinMQ dark chassis; the matrix and charts
   break out to the full column width; hairline borders, no shadows, one green accent. */
:root {
  --bg: #141414; --surface: #181818; --raised: #1f1f1f; --code-bg: #262626;
  --line: #2b2b2b; --line-soft: #1f1f1f; --line-strong: #414040;
  --fg: #fafafa; --text: #d9d6ce; --dim: #9d9a93; --faint: #6e6b66;
  --accent: #54be7e; --accent-bg: rgba(84, 190, 126, 0.13);
  --worse: #d98a6a; --worse-bg: rgba(217, 138, 106, 0.13);
  --sand: #c9b37f; --grey: #8a8780;
  --font-sans: "Inter", Arial, Helvetica, sans-serif;
  --font-serif: "Instrument Serif", Georgia, "Times New Roman", serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f7f5f2; --surface: #fffdfa; --raised: #efece6; --code-bg: #efece6;
    --line: #dcd8d0; --line-soft: #e9e5dd; --line-strong: #c4bfb5;
    --fg: #141414; --text: #2e2c28; --dim: #615d55; --faint: #8f8a80;
    --accent: #1f7a45; --accent-bg: rgba(31, 122, 69, 0.1);
    --worse: #a94d2b; --worse-bg: rgba(169, 77, 43, 0.1);
    --sand: #86702f; --grey: #77736b;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f7f5f2; --surface: #fffdfa; --raised: #efece6; --code-bg: #efece6;
  --line: #dcd8d0; --line-soft: #e9e5dd; --line-strong: #c4bfb5;
  --fg: #141414; --text: #2e2c28; --dim: #615d55; --faint: #8f8a80;
  --accent: #1f7a45; --accent-bg: rgba(31, 122, 69, 0.1);
  --worse: #a94d2b; --worse-bg: rgba(169, 77, 43, 0.1);
  --sand: #86702f; --grey: #77736b;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--text); font-family: var(--font-sans);
  font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased;
}
.wrap {
  max-width: 72rem; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 56px 96px;
  display: grid; gap: 72px;
}
section { display: grid; gap: 20px; min-width: 0; }
h1, h2, h3 { color: var(--fg); text-wrap: balance; margin: 0; }
h1 { font-family: var(--font-serif); font-weight: 400; font-size: clamp(40px, 6.4vw, 72px); line-height: 1.02; letter-spacing: -0.02em; }
h2 { font-weight: 600; font-size: clamp(24px, 3vw, 32px); line-height: 1.15; }
h3 { font-weight: 600; font-size: 18px; line-height: 1.35; }
p { margin: 0; max-width: 68ch; }
.lead { font-size: 19px; line-height: 1.6; max-width: 62ch; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
.muted { color: var(--dim); }
.small { font-size: 14px; }
a { color: var(--accent); text-underline-offset: 2px; }
a:hover { text-decoration: none; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
code { font-family: var(--font-mono); font-size: 0.88em; border: 1px solid var(--line-strong); border-radius: 4px; padding: 1px 5px; color: var(--fg); }
pre { margin: 0; font-family: var(--font-mono); font-size: 13.5px; line-height: 1.55; background: var(--code-bg); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; overflow-x: auto; color: var(--fg); }
pre code { border: 0; padding: 0; font-size: inherit; }
.del { color: var(--worse); } .add { color: var(--accent); }
header.top { display: grid; gap: 22px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 14px; color: var(--dim); }
.meta b { color: var(--text); font-weight: 500; }

/* Findings */
.findings { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.finding { background: var(--surface); padding: 22px 22px 24px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.finding .num { font-family: var(--font-serif); font-size: 46px; line-height: 1; color: var(--fg); font-variant-numeric: tabular-nums; }
.finding .num.good { color: var(--accent); }
.finding .num.bad { color: var(--worse); }
.finding h3 { font-size: 16px; }
.finding p { font-size: 14.5px; line-height: 1.55; color: var(--dim); }

ol.rec { margin: 0; padding: 0; list-style: none; counter-reset: r; display: grid; gap: 14px; }
ol.rec li { counter-increment: r; display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: baseline; max-width: 76ch; }
ol.rec li::before { content: counter(r); font-family: var(--font-mono); font-size: 13px; color: var(--accent); border: 1px solid var(--line-strong); border-radius: 999px; width: 26px; height: 26px; display: grid; place-items: center; }

/* Matrix */
.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button, .chip { font: inherit; font-size: 13.5px; color: var(--dim); background: transparent; border: 0; padding: 7px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--raised); color: var(--fg); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--fg); background: var(--accent-bg); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--dim); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; border: 1px solid var(--line-strong); }
.sw.good { background: var(--accent-bg); border-color: var(--accent); }
.sw.bad { background: var(--worse-bg); border-color: var(--worse); }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
.matrix { font-size: 13.5px; min-width: 980px; }
.matrix th, .matrix td { padding: 8px 10px; border-bottom: 1px solid var(--line-soft); text-align: right; white-space: nowrap; }
.matrix thead th { font-weight: 500; color: var(--dim); font-size: 12.5px; vertical-align: bottom; background: var(--surface); }
.matrix thead .grp th { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); border-bottom: 1px dashed var(--line-strong); text-align: center; }
.matrix thead th.v { font-family: var(--font-mono); font-size: 12px; color: var(--text); }
.matrix thead th.base { color: var(--fg); }
.matrix th.metric, .matrix td.metric { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; white-space: normal; min-width: 230px; max-width: 280px; }
.matrix td.metric .u { color: var(--faint); font-size: 12px; }
.matrix tr.scen td { background: var(--raised); color: var(--fg); font-weight: 500; text-align: left; font-size: 13px; padding-block: 9px; border-bottom: 1px solid var(--line); }
.matrix tr.scen td span { color: var(--dim); font-weight: 400; margin-left: 8px; }
.matrix tr.scen td.metric { background: var(--raised); }
.matrix td.cell { color: var(--dim); }
.matrix td.cell.good { color: var(--accent); background: var(--accent-bg); font-weight: 500; }
.matrix td.cell.bad { color: var(--worse); background: var(--worse-bg); font-weight: 500; }
.matrix td.cell.base { color: var(--fg); }
.matrix td.cell .r { display: block; font-size: 11px; color: var(--faint); font-weight: 400; }
.matrix td.empty { color: var(--line-strong); }
.foot { font-size: 13px; color: var(--dim); max-width: 90ch; }

/* Charts */
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 20px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px 20px 18px; display: grid; gap: 14px; min-width: 0; align-content: start; }
.card .sub { font-size: 13.5px; color: var(--dim); }
.card.wide { grid-column: 1 / -1; }
svg.line { width: 100%; height: auto; display: block; overflow: visible; }
svg.line text { font-family: var(--font-sans); font-size: 12px; fill: var(--dim); }
svg.line .grid { stroke: var(--line); stroke-width: 1; }
svg.line .axis { stroke: var(--line-strong); }
.bars { display: grid; gap: 14px; }
.bgroup { display: grid; gap: 5px; }
.bgroup .bt { font-size: 13px; color: var(--text); font-weight: 500; }
.brow { display: grid; grid-template-columns: 92px 1fr 64px; gap: 10px; align-items: center; font-size: 12.5px; }
.brow .bl { font-family: var(--font-mono); color: var(--dim); font-size: 12px; }
.brow .bv { text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }
.track { height: 12px; background: var(--line-soft); border-radius: 3px; overflow: hidden; }
.fill { height: 100%; border-radius: 3px; }
.c-stock { background: var(--worse); } .c-fix { background: var(--text); } .c-fixpf { background: var(--grey); }
.c-fixfl { background: var(--accent); } .c-acton { background: var(--sand); } .c-master { background: var(--faint); }

.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px 40px; align-items: start; }
.two > * { min-width: 0; }
.prose { display: grid; gap: 14px; }
.std th, .std td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line-soft); font-size: 14px; vertical-align: top; }
.std th { color: var(--dim); font-weight: 500; font-size: 12.5px; }
.std td:first-child { font-family: var(--font-mono); font-size: 13px; color: var(--fg); white-space: nowrap; }
.tag { font-family: var(--font-mono); font-size: 11.5px; border-radius: 999px; padding: 1px 8px; border: 1px solid var(--line-strong); color: var(--dim); white-space: nowrap; }
.tag.fast { border-color: var(--accent); color: var(--accent); }
.tag.slow { border-color: var(--worse); color: var(--worse); }
tr.first td { background: var(--accent-bg); }

.links { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.links a.l { display: grid; gap: 4px; text-decoration: none; padding: 16px 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--text); }
.links a.l:hover { border-color: var(--line-strong); }
.links a.l b { color: var(--fg); font-weight: 600; }
.links a.l span { font-size: 13.5px; color: var(--dim); }
.links a.l em { font-style: normal; color: var(--accent); font-size: 13.5px; }
ul.plain { margin: 0; padding-left: 18px; display: grid; gap: 8px; max-width: 76ch; }
hr.sep { border: 0; border-top: 1px dashed var(--line-strong); margin: 0; }
@media (max-width: 520px) {
  .wrap { padding-block: 32px 64px; gap: 56px; }
  .brow { grid-template-columns: 78px 1fr 56px; }
  .finding .num { font-size: 40px; }
}
@media (prefers-reduced-motion: no-preference) {
  .fill { transition: width 300ms cubic-bezier(0.4, 0, 0.2, 1); }
}
</style>
